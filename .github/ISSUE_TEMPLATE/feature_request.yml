name: Feature request
description: Suggest an improvement aligned with the shotport wedge
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: "What agent workflow is awkward or expensive today?"
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: "What should shotport do? Keep it to the wedge: token-cheap, text-first capture."
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
