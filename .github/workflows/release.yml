name: release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: install
        run: bun install --frozen-lockfile
      - name: test
        run: bun test
      - name: build cross-platform binaries
        run: |
          mkdir -p dist
          bun build ./index.ts --compile --target=bun-darwin-arm64 --outfile dist/shotport-darwin-arm64
          bun build ./index.ts --compile --target=bun-darwin-x64   --outfile dist/shotport-darwin-x64
          bun build ./index.ts --compile --target=bun-linux-x64     --outfile dist/shotport-linux-x64
          bun build ./index.ts --compile --target=bun-linux-arm64   --outfile dist/shotport-linux-arm64
      - name: checksums
        run: cd dist && shasum -a 256 shotport-* > SHA256SUMS.txt
      - name: release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/shotport-darwin-arm64
            dist/shotport-darwin-x64
            dist/shotport-linux-x64
            dist/shotport-linux-arm64
            dist/SHA256SUMS.txt
          generate_release_notes: true
